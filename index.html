<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Calendar Output Matrix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  /* Longhi Group DM v2.0 brand palette */
  --brand-dark-blue:#1e3b5c; --brand-light-blue:#83abd6; --brand-black:#000000; --brand-white:#ffffff;
  --bg:#ffffff; --panel:#f3f7fb; --panel-2:#e8ebef; --line:#d2d8de;
  --text:#000000; --muted:#4b627d; --accent:#1e3b5c; --accent-2:#83abd6; --steel:#62768d;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg); color:var(--text); font-family:'Calibri','Segoe UI',Arial,sans-serif; }
.mono{ font-family:'Calibri','Segoe UI',Arial,sans-serif; }

.topbar{ padding:22px 0; border-bottom:3px solid var(--brand-dark-blue); background:var(--brand-dark-blue); }
.topbar-inner{ max-width:1400px; margin:0 auto; padding:0 28px; position:relative; text-align:center; }
.topbar h1{ font-size:24px; letter-spacing:0.5px; font-weight:700; color:var(--brand-white); }
.topbar h1 .accent{ color:var(--brand-light-blue); }
.topbar .sub{ color:var(--brand-light-blue); font-size:12.5px; margin-top:6px; }

.week-nav{ display:flex; align-items:center; gap:10px; background:var(--brand-white); border:1px solid var(--line); border-radius:8px; padding:8px 10px; position:absolute; right:28px; top:50%; transform:translateY(-50%); }
.brand-logo{ position:absolute; left:28px; top:50%; transform:translateY(-50%); background:var(--brand-white); border-radius:8px; padding:6px 12px; display:flex; align-items:center; }
.brand-logo img{ display:block; height:28px; width:auto; }
.week-nav button{ width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--brand-dark-blue); cursor:pointer; font-size:14px; }
.week-nav button:hover{ border-color:var(--brand-dark-blue); color:var(--brand-dark-blue); background:var(--panel-2); }
.week-nav button:disabled{ opacity:0.3; cursor:not-allowed; }
.week-nav select{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; font-family:'Calibri','Segoe UI',Arial,sans-serif; cursor:pointer; }
#refreshData{ width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--brand-dark-blue); cursor:pointer; font-size:15px; }
#refreshData:hover{ border-color:var(--brand-dark-blue); background:var(--panel-2); }
#refreshData.spinning{ animation:spin 0.8s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
#statusBar.error{ color:#B23B2E; }

@media (max-width: 700px){
  .topbar-inner{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .week-nav{ position:static; transform:none; }
  .brand-logo{ position:static; transform:none; }
}

.wrap{ max-width:1400px; margin:0 auto; padding:22px 28px 60px; }

table.matrix{ border-collapse:separate; border-spacing:0; width:100%; min-width:1100px; }
table.matrix th, table.matrix td{ border:1px solid var(--line); padding:0; text-align:center; }
table.matrix thead th{
  background:var(--brand-dark-blue); padding:8px 4px; font-size:11px; color:var(--brand-white); font-weight:600;
  position:sticky; top:0; z-index:2;
}
table.matrix thead th .dow{ display:block; font-size:10px; color:var(--brand-light-blue); text-transform:uppercase; letter-spacing:0.06em; }
table.matrix thead th .dd{ display:block; font-family:'Calibri','Segoe UI',Arial,sans-serif; font-size:12.5px; color:var(--brand-white); margin-top:2px; }
table.matrix thead th.total-head{ background: var(--brand-dark-blue); color:var(--brand-light-blue); }

td.rowhead{
  background:var(--panel-2); text-align:left; padding:8px 10px; font-size:16px; font-weight:700; color:var(--brand-dark-blue);
  white-space:normal; vertical-align:middle; position:sticky; left:0; z-index:1; max-width:210px;
}
td.shifthead{
  background:var(--panel); text-align:left; padding:6px 10px; font-size:11px; color:var(--muted);
  white-space:nowrap; position:sticky; left:0; z-index:1; font-family:'Calibri','Segoe UI',Arial,sans-serif;
}
td.cell{ padding:0; font-size:11px; min-width:100px; height:34px; }
td.cell.empty{ color:var(--muted); opacity:0.35; padding:6px 3px; text-align:center; }
td.total-cell{ background:var(--panel); font-weight:700; height:34px; padding:0; }
td.shipment-cell{ padding:6px 4px; vertical-align:top; text-align:center; height:auto; }
.shipment-list{ display:flex; flex-direction:column; gap:4px; }
.shipment-item{ background:var(--brand-white); border:1px solid var(--line); border-radius:4px; padding:5px 6px; font-size:10.5px; color:var(--text); font-weight:600; }
td.cell.plan-cell, td.total-cell.plan-cell{ color:var(--muted); font-style:italic; font-weight:600; font-size:12px; }
td.cell.actual-cell, td.total-cell.actual-cell{ color:var(--brand-dark-blue); font-weight:700; font-size:12.5px; }
td.target-cell{ background:var(--panel); font-weight:700; height:34px; padding:0; }
td.target-cell.empty{ color:var(--muted); opacity:0.35; padding:6px 10px; text-align:center; font-weight:600; font-size:12.5px; }
.target-pct-only{ font-family:'Calibri','Segoe UI',Arial,sans-serif; font-weight:700; font-size:13.5px; }
td.target-static-cell{ background:var(--brand-white); border-left:1px solid var(--line); color:var(--brand-dark-blue); font-weight:700; font-size:17px; text-align:center; vertical-align:middle; }
td.target-static-cell.empty{ color:var(--muted); opacity:0.35; font-size:12.5px; font-weight:600; }
tr.combine-row td.daily-total-head{ font-style:italic; color:var(--steel); }
tr.combine-row td{ background:var(--panel-2); }
tr.combine-row td.target-cell{ background-blend-mode:normal; }
td.total-cell.empty{ padding:6px 3px; text-align:center; }

.split-row{ display:flex; align-items:center; justify-content:space-between; height:100%; padding:0 8px; gap:6px; }
.split-val{ font-family:'Calibri','Segoe UI',Arial,sans-serif; font-weight:700; font-size:11.5px; text-align:left; white-space:nowrap; }
.split-div{ width:1px; align-self:stretch; margin:6px 0; background:rgba(30,59,92,0.35); flex-shrink:0; }
.split-pct{ font-family:'Calibri','Segoe UI',Arial,sans-serif; font-weight:700; font-size:11.5px; text-align:right; white-space:nowrap; }

tr.daily-total-row td{ border-top:2px solid var(--brand-dark-blue); }
td.daily-total-head{
  background:var(--panel); text-align:left; padding:6px 10px; font-size:11px; font-weight:700; color:var(--brand-dark-blue);
  white-space:nowrap; position:sticky; left:0; z-index:1; text-transform:uppercase; letter-spacing:0.04em;
}
td.daily-total-cell{ padding:0; font-size:11px; min-width:100px; font-weight:700; height:34px; }
td.daily-total-cell.empty{ padding:6px 10px; text-align:right; }

tr.group-spacer td{ background:var(--brand-dark-blue); padding:0; height:10px; border:none; }

.legend-row{ display:flex; gap:16px; align-items:center; padding:14px 0 4px; font-size:10.5px; color:var(--muted); }
.legend-row .sw{ width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:-1px; }

footer{ text-align:center; color:var(--muted); font-size:11px; padding:20px 0 30px; }
</style>
</head>

  return '#F3CFC7';
}
function dowShort(iso){ const dt=new Date(iso+'T00:00:00'); return dt.toLocaleDateString('en-US',{weekday:'short'}); }
function ddShort(iso){ const dt=new Date(iso+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

const BASE_MONDAY_UTC = Date.UTC(2025, 11, 29); // canonical Monday for week 1
const MONTH_ABBR = {
  jan:0, feb:1, mar:2, apr:3, may:4, mei:4, jun:5, jun_i:5, jul:6, jul_i:6,
  aug:7, agu:7, ags:7, sep:8, sept:8, oct:9, okt:9, nov:10, des:11, dec:11
};

function canonicalMondayUTC(week){ return BASE_MONDAY_UTC + (week-1)*7*86400000; }

// Converts a "YYWW" code (e.g. 2602 = week 2 of 2026) into an approximate
// week number on OUR internal Monday-anchored scale — used only as a rough
// hint for resolving ambiguous slash dates, never as the final week bucket.
function yywwToHintWeek(code){
  const s = String(code||'').trim();
  const m = s.match(/^(\d{2})(\d{2})$/);
  if(!m) return null;
  const year = 2000 + parseInt(m[1]);
  const wk = parseInt(m[2]);
  const jan1 = Date.UTC(year,0,1);
  const jan1Dow = new Date(jan1).getUTCDay();
  const daysToMonday = (jan1Dow===0) ? 1 : (jan1Dow===1 ? 0 : 8-jan1Dow);
  const firstMonday = jan1 + daysToMonday*86400000;
  const approxMondayUTC = firstMonday + (wk-1)*7*86400000;
  return 1 + Math.floor((approxMondayUTC - BASE_MONDAY_UTC)/(7*86400000));
}

// Parse dates like "2-Jan-2026", "13-Jan-26", "04-Agu-26" (Indonesian month
// abbreviations included), or ambiguous "8/4/2026" / "01/13/2026" slash
// dates. For slash dates, tries both day/month orderings and picks whichever
// lands inside (or near) the row's hinted week window — unless
// preferMonthFirst is set, which skips the guesswork for sources already
// confirmed to consistently use MM/DD (e.g. rows like "01/13" are only
// valid as MM/DD, since day 01 / month 13 doesn't exist).
function parseProdDate(raw, week, preferMonthFirst){
  if(!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-](\d{2,4})$/);
  if(m){
    const day = parseInt(m[1]);
    const mon = MONTH_ABBR[m[2].slice(0,3).toLowerCase()];
    let year = parseInt(m[3]);
    if(year < 100) year += 2000;
    if(mon===undefined) return null;
    return Date.UTC(year, mon, day);
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    const a = parseInt(m[1]), b = parseInt(m[2]);
    let year = parseInt(m[3]);
    if(year < 100) year += 2000;
    const candA = Date.UTC(year, a-1, b); // month/day
    const candB = Date.UTC(year, b-1, a); // day/month
    if(preferMonthFirst) return candA;
    if(week){
      const cmon = canonicalMondayUTC(week);
      const lo = cmon - 5*86400000, hi = cmon + 11*86400000; // generous window
      const aFits = candA>=lo && candA<=hi;
      const bFits = candB>=lo && candB<=hi;
      if(aFits && !bFits) return candA;
      if(bFits && !aFits) return candB;
    }
    return candB; // default: day/month (Indonesian convention)
  }
  const generic = Date.parse(s);
  return isNaN(generic) ? null : generic;
}

async function fetchCsvRows(url, retries=2){
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const parsed = Papa.parse(text, {skipEmptyLines:false});
      return parsed.data;
    }catch(e){
      lastErr = e;
      if(attempt<retries) await new Promise(r=>setTimeout(r, 600*(attempt+1)));
    }
  }
  throw lastErr;
}

// Maps a header cell like "Screening" / "Crushing Candle Nut" / "Ready Mix"
// to our internal line keys. "readymix" is the COMBINED target for both
// Ready Mix lines together, not split per sub-line.
function headerToTargetKey(h){
  const s = (h||'').toString().trim().toLowerCase();
  if(!s) return null;
  if(s.includes('screen')) return 'screaning';
  if(s.includes('ready mix') || s.includes('readymix')) return 'readymix';
  if(s.includes('briquette')) return 'briquettes';
  if(s.includes('crush') || s.includes('candle')) return 'cruiser';
  if(s.includes('wood')) return 'woodline';
  if(s.includes('bag')) return 'bagmaking';
  return null;
}

function parseTargetNumber(raw){
  if(raw===undefined || raw===null) return null;
  const s = raw.toString().trim().replace(/,/g,'');
  if(s==='') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Parses the wide-format Weekly Targets tab: one row per week, one column
// per line. Returns { week: { screaning, cruiser, woodline, briquettes, readymix } }
function parseWeeklyTargets(rows){
  const out = {};
  if(!rows || rows.length===0) return out;
  let headerIdx = -1;
  for(let i=0;i<rows.length;i++){
    const cell = (rows[i][0]||'').toString().trim().toLowerCase();
    if(cell==='week'){ headerIdx = i; break; }
  }
  if(headerIdx===-1) return out;
  const header = rows[headerIdx];
  const colMap = {}; // colIndex -> targetKey
  for(let c=1;c<header.length;c++){
    const key = headerToTargetKey(header[c]);
    if(key) colMap[c] = key;
  }
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length===0) continue;
    const week = parseInt((r[0]||'').toString().trim());
    if(isNaN(week)) continue;
    out[week] = out[week] || {};
    for(const c of Object.keys(colMap)){
      const val = parseTargetNumber(r[c]);
      if(val!==null) out[week][colMap[c]] = val;
    }
  }
  return out;
}

function processSource(source, rows, out, dayTargetsOut, shipmentsOut){
  const c = source.cols;
  let headerIdx = -1;
  for(let i=0;i<rows.length;i++){
    if(source.deriveWeekFromDate && c.week===undefined){
      const cell = (rows[i][c.date]||'').toString().trim().toLowerCase();
      if(cell.startsWith('production')){ headerIdx = i; break; }
    } else {
      const cell = (rows[i][c.week]||'').toString().trim().toLowerCase();
      if(cell.startsWith('week')){ headerIdx = i; break; }
    }
  }
  if(headerIdx===-1) throw new Error('Header row not found for '+source.key);

  // Containers Shipment: one row per container, no numeric value — just a
  // product name per date. Kept in its own side-channel (shipmentsOut)
  // rather than the numeric cellSums pipeline.
  if(source.isShipment){
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i];
      if(!r || r.length===0) continue;
      if(source.fullContainerCol!==undefined){
        const fc = (r[source.fullContainerCol]||'').toString().trim();
        if(fc !== '1') continue; // only single-product ("full container") shipments
      }
      const rawWeekCode = c.week!==undefined ? (r[c.week]||'').toString().trim() : '';
      const rawDate = (r[c.date]||'').toString().trim();
      const product = (r[c.product]||'').toString().trim();
      if(!rawDate || !product || product==='#N/A') continue;

      const hintWeek = rawWeekCode ? yywwToHintWeek(rawWeekCode) : null;
      let dUTC = parseProdDate(rawDate, hintWeek, true);
      if(dUTC===null) continue;
      let dt = new Date(dUTC);
      if(dt.getUTCFullYear() >= 2900){
        dUTC = Date.UTC(dt.getUTCFullYear()-1000, dt.getUTCMonth(), dt.getUTCDate());
        dt = new Date(dUTC);
      }
      if(dUTC < Date.UTC(2025,10,1) || dUTC > Date.UTC(2026,8,1)) continue;

      // Week bucket comes from the resolved date itself (Monday-anchored),
      // not the sheet's own week code — that code is only used as a hint
      // above for resolving ambiguous slash dates.
      const effWeek = 1 + Math.floor((dUTC - BASE_MONDAY_UTC)/(7*86400000));
      const dateStr = dt.toISOString().slice(0,10);
      shipmentsOut[effWeek] = shipmentsOut[effWeek] || {};
      shipmentsOut[effWeek][dateStr] = shipmentsOut[effWeek][dateStr] || [];
      shipmentsOut[effWeek][dateStr].push(product);
    }
    return;
  }

  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length===0) continue;
    const rawWeek = (source.deriveWeekFromDate ? '' : (r[c.week]||'')).toString().trim();
    const rawDate = (r[c.date]||'').toString().trim();
    const rawShift = source.noShifts ? '1' : (r[c.shift]||'').toString().trim();
    const rawVal = (r[c.val]||'').toString().trim().replace(/,/g,'');
    if(!rawDate || (!source.noShifts && !rawShift) || rawVal==='') continue;
    const val = parseFloat(rawVal);
    if(isNaN(val)) continue;

    let week = null;
    if(!source.deriveWeekFromDate){
      week = parseInt(rawWeek);
      if(isNaN(week)) continue;
    }

    let dUTC = parseProdDate(rawDate, week);
    if(dUTC===null) continue;

    // fix obvious 1000-year typo (e.g. 3026 -> 2026)
    let dt = new Date(dUTC);
    if(dt.getUTCFullYear() >= 2900){
      dUTC = Date.UTC(dt.getUTCFullYear()-1000, dt.getUTCMonth(), dt.getUTCDate());
      dt = new Date(dUTC);
    }

    let effWeek;
    if(source.deriveWeekFromDate){
      // No trustworthy week column at all — the date itself is the source
      // of truth for which Monday-Sunday week this row belongs to.
      effWeek = 1 + Math.floor((dUTC - BASE_MONDAY_UTC)/(7*86400000));
    } else {
      // fix week-boundary drift: a Sunday tagged as belonging to the *next*
      // Monday-Sunday week actually belongs to the previous week's Sunday
      effWeek = week;
      let cmon = canonicalMondayUTC(effWeek);
      if(dUTC === cmon - 86400000){
        effWeek = effWeek - 1;
      }
    }

    // drop genuine stray rows: a full year (or more) outside the reporting window
    if(dUTC < Date.UTC(2025,10,1) || dUTC > Date.UTC(2026,8,1)) continue;

    const shift = source.noShifts ? '1' : String(parseInt(rawShift));
    const value = Math.ceil(val);
    const dateStr = dt.toISOString().slice(0,10);

    let gkey = source.key;
    if(source.isReadyMix || source.isPackingLine){
      const line = parseInt((r[c.line]||'').toString().trim());
      if(source.isReadyMix && line===3) continue; // Ready Mix Line 3 no longer displayed
      if(line<1 || line>3) continue;
      gkey = (source.isReadyMix ? 'readymix_l' : 'packing_l') + line;
    }

    out.push([gkey, effWeek, shift, dateStr, value]);

    // Bag Making (and any future no-shift line): capture that day's own
    // Planning value as its target, instead of relying on a fixed constant.
    if(source.noShifts && c.planning!==undefined){
      const rawPlan = (r[c.planning]||'').toString().trim().replace(/,/g,'');
      const planVal = parseFloat(rawPlan);
      if(!isNaN(planVal)){
        dayTargetsOut[effWeek] = dayTargetsOut[effWeek] || {};
        dayTargetsOut[effWeek][gkey] = dayTargetsOut[effWeek][gkey] || {};
        dayTargetsOut[effWeek][gkey][dateStr] = Math.ceil(planVal);
      }
    }
  }
}

function buildData(rows, dayTargets){
  dayTargets = dayTargets || {};
  const cellSums = {}; // week -> gkey -> shift -> date -> sum
  for(const [gkey, week, shift, dateStr, value] of rows){
    cellSums[week] = cellSums[week] || {};
    cellSums[week][gkey] = cellSums[week][gkey] || {'1':{}, '2':{}, '3':{}};
    cellSums[week][gkey][shift][dateStr] = (cellSums[week][gkey][shift][dateStr]||0) + value;
  }
  const allWeeks = Object.keys(cellSums).map(Number).sort((a,b)=>a-b);
  const weekDays = {}, cells = {}, rowTotals = {};

  for(const w of allWeeks){
    const ws = String(w);
    const cmon = canonicalMondayUTC(w);
    weekDays[ws] = Array.from({length:7}, (_,i)=> new Date(cmon+i*86400000).toISOString().slice(0,10));
    cells[ws] = {}; rowTotals[ws] = {};
    for(const g of GROUP_ORDER){
      const shiftsData = (cellSums[w]||{})[g.key] || {'1':{}, '2':{}, '3':{}};
      cells[ws][g.key] = {}; rowTotals[ws][g.key] = {};
      const shiftsToProcess = g.noShifts ? ['1'] : ['1','2','3'];
      for(const shift of shiftsToProcess){
        const dayVals = shiftsData[shift] || {};
        const dayCells = {};
        let total = 0, ndays = 0, targetSum = 0, targetDays = 0;
        for(const dateStr of Object.keys(dayVals).sort()){
          const v = Math.round(dayVals[dateStr]);
          let pct, dTarget = null;
          if(g.noShifts){
            dTarget = (dayTargets[w] && dayTargets[w][g.key] && dayTargets[w][g.key][dateStr]) || null;
            pct = dTarget ? Math.round((v/dTarget*100)*10)/10 : null;
            if(dTarget){ targetSum += dTarget; targetDays++; }
          } else {
            pct = Math.round((v/g.target*100)*10)/10;
          }
          dayCells[dateStr] = {value:v, pct:pct, target:(g.noShifts?dTarget:undefined)};
          total += v; ndays += 1;
        }
        cells[ws][g.key][shift] = dayCells;
        if(ndays>0){
          let pctTotal;
          if(g.noShifts){
            pctTotal = targetDays>0 ? Math.round((total/targetSum*100)*10)/10 : null;
          } else {
            pctTotal = Math.round((total/(g.target*ndays)*100)*10)/10;
          }
          rowTotals[ws][g.key][shift] = {total:total, pct:pctTotal, days:ndays, targetSum:(g.noShifts?targetSum:undefined)};
        } else {
          rowTotals[ws][g.key][shift] = {total:null, pct:null, days:0};
        }
      }
      if(g.noShifts){
        cells[ws][g.key]['2'] = {}; cells[ws][g.key]['3'] = {};
        rowTotals[ws][g.key]['2'] = {total:null,pct:null,days:0};
        rowTotals[ws][g.key]['3'] = {total:null,pct:null,days:0};
      }
    }
  }

  return {
    allWeeks: allWeeks,
    weekDays: weekDays,
    groups: GROUP_ORDER.map(g=>({
      key:g.key, label:g.label, target:g.target, unit:g.unit||'kg', noShifts:!!g.noShifts,
      isShipment:!!g.isShipment, noWeeklyTarget:!!g.noWeeklyTarget, subtitleOverride:g.subtitleOverride
    })),
    cells: cells,
    rowTotals: rowTotals,
    dayTargetsRaw: dayTargets,
  };
}

const statusBar = document.getElementById('statusBar');
const refreshBtn = document.getElementById('refreshData');

async function loadData(){
  refreshBtn.classList.add('spinning');
  statusBar.className = '';
  statusBar.textContent = 'Loading latest data from Google Sheets…';
  const allRows = [];
  const dayTargets = {};
  const shipments = {};
  const failed = [];
  for(const source of SOURCES){
    if(!source.url) continue; // not set up yet — skip quietly, no error shown
    try{
      const rows = await fetchCsvRows(source.url);
      processSource(source, rows, allRows, dayTargets, shipments);
    }catch(e){
      failed.push(source.key);
      console.error('Failed to load', source.key, e);
    }
  }
  let weeklyTargets = {};
  if(WEEKLY_TARGETS_URL){
    try{
      const targetRows = await fetchCsvRows(WEEKLY_TARGETS_URL);
      weeklyTargets = parseWeeklyTargets(targetRows);
    }catch(e){
      failed.push('WeeklyTargets');
      console.error('Failed to load weekly targets', e);
    }
  }
  refreshBtn.classList.remove('spinning');
  if(allRows.length===0){
    statusBar.className = 'error';
    statusBar.textContent = 'Could not load any data — check the Sheets are still published to web, or your network/sharing settings.';
    return;
  }
  DATA = buildData(allRows, dayTargets);
  DATA.weeklyTargets = weeklyTargets;
  DATA.shipments = shipments;
  if(failed.length){
    statusBar.className = 'error';
    statusBar.textContent = 'Loaded, but could not reach: ' + failed.join(', ') + ' — showing the other lines only.';
  } else {
    const now = new Date();
    statusBar.textContent = 'Live data — last refreshed ' + now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  }
  initUI();
}

let weekSelect, weeks, currentIdx;

function initUI(){
  weekSelect = document.getElementById('weekSelect');
  weeks = DATA.allWeeks;
  weekSelect.innerHTML = '';
  weeks.forEach(w=>{
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = 'Week '+w;
    weekSelect.appendChild(opt);
  });
  currentIdx = weeks.length ? weeks.length-1 : 0; // land on the most recent week
  weekSelect.value = weeks[currentIdx];
  document.getElementById('prevWeek').onclick = ()=>{ if(currentIdx>0){currentIdx--; weekSelect.value=weeks[currentIdx]; render();} };
  document.getElementById('nextWeek').onclick = ()=>{ if(currentIdx<weeks.length-1){currentIdx++; weekSelect.value=weeks[currentIdx]; render();} };
  weekSelect.onchange = ()=>{ currentIdx = weeks.indexOf(parseInt(weekSelect.value)); render(); };
  render();
}

refreshBtn.onclick = loadData;

function render(){
  const w = weeks[currentIdx];
  document.getElementById('prevWeek').disabled = currentIdx===0;
  document.getElementById('nextWeek').disabled = currentIdx===weeks.length-1;

  const days = DATA.weekDays[String(w)];
  const table = document.getElementById('matrixTable');
  table.innerHTML = '';

  // Header
  const thead = document.createElement('thead');
  const htr = document.createElement('tr');
  htr.innerHTML = `<th colspan="2" style="min-width:230px;">MACHINE / SHIFT</th>` +
    days.map(d=>`<th><span class="dow">${dowShort(d)}</span><span class="dd">${ddShort(d)}</span></th>`).join('') +
    `<th class="total-head">WEEK<br>TOTAL</th>` +
    `<th class="total-head">WEEKLY<br>TARGET</th>`;
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const groupWeekSums = {};

  DATA.groups.forEach((g, gi)=>{
    // Containers Shipment: a list of what shipped each day, not a number.
    // One row of stacked product boxes, then a Daily Total row with counts.
    if(g.isShipment){
      const shipForWeek = (DATA.shipments && DATA.shipments[w]) || {};
      const trList = document.createElement('tr');
      let listHtml = `<td class="rowhead" colspan="2" style="text-align:center;">${g.label}</td>`;
      let weekCount = 0;
      days.forEach(day=>{
        const items = shipForWeek[day] || [];
        weekCount += items.length;
        if(items.length){
          listHtml += `<td class="shipment-cell"><div class="shipment-list">` +
            items.map(p=>`<div class="shipment-item">${p}</div>`).join('') +
            `</div></td>`;
        } else {
          listHtml += `<td class="cell empty">&mdash;</td>`;
        }
      });
      listHtml += `<td class="total-cell empty">&mdash;</td>`;
      listHtml += `<td class="target-cell empty" rowspan="2">&mdash;</td>`;
      trList.innerHTML = listHtml;
      tbody.appendChild(trList);

      const trTotal = document.createElement('tr');
      trTotal.className = 'daily-total-row';
      let totalHtml = `<td class="daily-total-head" colspan="2">Daily Total</td>`;
      days.forEach(day=>{
        const n = (shipForWeek[day] || []).length;
        totalHtml += n>0 ? `<td class="daily-total-cell actual-cell">${n} Container${n===1?'':'s'}</td>` : `<td class="daily-total-cell empty">&mdash;</td>`;
      });
      totalHtml += weekCount>0 ? `<td class="total-cell daily-total-cell actual-cell">${weekCount} Container${weekCount===1?'':'s'}</td>` : `<td class="total-cell daily-total-cell empty">&mdash;</td>`;
      trTotal.innerHTML = totalHtml;
      tbody.appendChild(trTotal);

      if(gi < DATA.groups.length - 1){
        const trSpacer = document.createElement('tr');
        trSpacer.className = 'group-spacer';
        trSpacer.innerHTML = `<td colspan="${4 + days.length}"></td>`;
        tbody.appendChild(trSpacer);
      }
      return;
    }

    const cellsForGroup = DATA.cells[String(w)][g.key] || {};
    const totalsForGroup = DATA.rowTotals[String(w)][g.key] || {};
    const targetKey = (g.key==='readymix_l1' || g.key==='readymix_l2') ? null : g.key;
    const weekTargets = (DATA.weeklyTargets && DATA.weeklyTargets[w]) || {};
    let realTarget;
    if(g.noWeeklyTarget){
      realTarget = undefined;
    } else if(g.noShifts){
      const tot1 = totalsForGroup['1'];
      realTarget = (tot1 && tot1.targetSum) ? tot1.targetSum : undefined;
    } else {
      realTarget = targetKey ? weekTargets[targetKey] : undefined;
    }
    const hasRealTarget = realTarget !== undefined && realTarget !== null;

    // Bag Making: no shifts, and the "target" is a per-day Planning figure
    // rather than a fixed number — shown as 3 rows (Daily Plan / Actual
    // output / Percentage) instead of the usual Shift 1/2/3 + Daily Total.
    if(g.noShifts){
      const tot1 = totalsForGroup['1'] || {total:null, pct:null, days:0, targetSum:0};
      const rowDefs = [
        { label:'Daily Plan', kind:'plan' },
        { label:'Actual Output', kind:'actual' },
        { label:'Percentage', kind:'pct' },
      ];
      rowDefs.forEach((rd, ri)=>{
        const tr = document.createElement('tr');
        let rowHtml = '';
        if(ri===0){
          rowHtml += `<td class="rowhead" rowspan="3">${g.label}<div style="font-weight:400; color:var(--muted); font-size:13px; margin-top:3px;">Daily Target depend on bag size</div></td>`;
        }
        rowHtml += `<td class="shifthead">${rd.label}</td>`;
        days.forEach(day=>{
          const rec = (cellsForGroup['1'] || {})[day];
          const dTarget = (rec && rec.target!==undefined && rec.target!==null) ? rec.target
            : ((DATA.dayTargetsRaw && DATA.dayTargetsRaw[w] && DATA.dayTargetsRaw[w][g.key] && DATA.dayTargetsRaw[w][g.key][day]) || null);
          if(rd.kind==='plan'){
            rowHtml += dTarget!==null ? `<td class="cell plan-cell">${fmt(dTarget)}</td>` : `<td class="cell empty">&mdash;</td>`;
          } else if(rd.kind==='actual'){
            rowHtml += rec ? `<td class="cell actual-cell">${fmt(rec.value)}</td>` : `<td class="cell empty">&mdash;</td>`;
          } else {
            if(rec && rec.pct!==null){
              rowHtml += `<td class="cell" style="background:${bandBgSolid(rec.pct)};"><span class="target-pct-only" style="color:${bandText(rec.pct)}">${rec.pct}%</span></td>`;
            } else {
              rowHtml += `<td class="cell empty">&mdash;</td>`;
            }
          }
        });
        if(rd.kind==='plan'){
          rowHtml += tot1.targetSum ? `<td class="total-cell plan-cell">${fmt(tot1.targetSum)}</td>` : `<td class="total-cell empty">&mdash;</td>`;
        } else if(rd.kind==='actual'){
          rowHtml += (tot1.total!==null) ? `<td class="total-cell actual-cell">${fmt(tot1.total)}</td>` : `<td class="total-cell empty">&mdash;</td>`;
        } else {
          rowHtml += (tot1.pct!==null) ? `<td class="total-cell" style="background:${bandBgSolid(tot1.pct)};"><span class="target-pct-only" style="color:${bandText(tot1.pct)}">${tot1.pct}%</span></td>` : `<td class="total-cell empty">&mdash;</td>`;
        }
        if(ri===0){
          rowHtml += hasRealTarget
            ? `<td class="target-static-cell" rowspan="3">${fmt(realTarget)}</td>`
            : `<td class="target-static-cell empty" rowspan="3">&mdash;</td>`;
        }
        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });
      if(gi < DATA.groups.length - 1){
        const trSpacer = document.createElement('tr');
        trSpacer.className = 'group-spacer';
        trSpacer.innerHTML = `<td colspan="${4 + days.length}"></td>`;
        tbody.appendChild(trSpacer);
      }
      return;
    }

    const shiftList = [1,2,3];
    shiftList.forEach((shift, si)=>{
      const tr = document.createElement('tr');
      let rowHtml = '';
      if(si===0){
        const subtitle = g.subtitleOverride || `target ${fmt(g.target)} ${g.unit||'kg'}/shift`;
        rowHtml += `<td class="rowhead" rowspan="${shiftList.length}">${g.label}<div style="font-weight:400; color:var(--muted); font-size:13px; margin-top:3px;">${subtitle}</div></td>`;
      }
      rowHtml += `<td class="shifthead">Shift ${shift}</td>`;

      days.forEach(day=>{
        const rec = (cellsForGroup[String(shift)] || {})[day];
        if(rec){
          rowHtml += `<td class="cell" style="background:${bandBgSolid(rec.pct)};">
            <div class="split-row">
              <span class="split-val" style="color:${bandText(rec.pct)}">${fmt(rec.value)}</span>
              <span class="split-div"></span>
              <span class="split-pct" style="color:${bandText(rec.pct)}">${rec.pct===null?'&mdash;':rec.pct+'%'}</span>
            </div>
          </td>`;
        } else {
          rowHtml += `<td class="cell empty">&mdash;</td>`;
        }
      });

      const tot = totalsForGroup[String(shift)];
      if(tot && tot.total!==null){
        rowHtml += `<td class="total-cell" style="background:${bandBgSolid(tot.pct)};">
          <div class="split-row">
            <span class="split-val" style="color:${bandText(tot.pct)}">${fmt(tot.total)}</span>
            <span class="split-div"></span>
            <span class="split-pct" style="color:${bandText(tot.pct)}">${tot.pct===null?'&mdash;':tot.pct+'%'}</span>
          </div>
        </td>`;
      } else {
        rowHtml += `<td class="total-cell empty">&mdash;</td>`;
      }
      // Weekly Target is a line-level concept (real management target), not
      // a per-shift one — shown once, spanning the data rows for this line.
      if(si===0){
        if(hasRealTarget){
          rowHtml += `<td class="target-static-cell" rowspan="${shiftList.length}">${fmt(realTarget)}</td>`;
        } else {
          rowHtml += `<td class="target-static-cell empty" rowspan="${shiftList.length}">&mdash;</td>`;
        }
      }

      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    });

    // Daily Total row: sum of all shifts logged that day, for this line
    const trTotal = document.createElement('tr');
    trTotal.className = 'daily-total-row';
    let totalRowHtml = `<td class="daily-total-head" colspan="2">Daily Total</td>`;
    let weekSum = 0, weekShiftCount = 0;
    const dayVals = {}; // day -> sum, kept for the Ready Mix combine step below
    days.forEach(day=>{
      let daySum = 0, dayCount = 0;
      [1,2,3].forEach(shift=>{
        const rec = (cellsForGroup[String(shift)] || {})[day];
        if(rec){ daySum += rec.value; dayCount++; }
      });
      dayVals[day] = daySum;
      if(dayCount>0){
        const dayPct = Math.round((daySum/(g.target*dayCount))*1000)/10;
        weekSum += daySum; weekShiftCount += dayCount;
        totalRowHtml += `<td class="daily-total-cell" style="background:${bandBgSolid(dayPct)};">
          <div class="split-row">
            <span class="split-val" style="color:${bandText(dayPct)}">${fmt(daySum)}</span>
            <span class="split-div"></span>
            <span class="split-pct" style="color:${bandText(dayPct)}">${dayPct}%</span>
          </div>
        </td>`;
      } else {
        totalRowHtml += `<td class="daily-total-cell empty">&mdash;</td>`;
      }
    });
    if(weekShiftCount>0){
      const weekPct = Math.round((weekSum/(g.target*weekShiftCount))*1000)/10;
      totalRowHtml += `<td class="total-cell daily-total-cell" style="background:${bandBgSolid(weekPct)};">
        <div class="split-row">
          <span class="split-val" style="color:${bandText(weekPct)}">${fmt(weekSum)}</span>
          <span class="split-div"></span>
          <span class="split-pct" style="color:${bandText(weekPct)}">${weekPct}%</span>
        </div>
      </td>`;
    } else {
      totalRowHtml += `<td class="total-cell daily-total-cell empty">&mdash;</td>`;
    }

    // Weekly Target column here shows only the achievement % against the
    // real target (the raw target number itself is shown once, spanning
    // the 3 shift rows above). Ready Mix Line 1 / Line 2 don't get an
    // individual target — theirs is combined into the "Ready Mix Total" row.
    if(hasRealTarget){
      const achievePct = Math.round((weekSum/realTarget)*1000)/10;
      totalRowHtml += `<td class="target-cell daily-total-cell" style="background:${bandBgSolid(achievePct)};">
        <span class="target-pct-only" style="color:${bandText(achievePct)}">${achievePct}%</span>
      </td>`;
    } else {
      totalRowHtml += `<td class="target-cell daily-total-cell empty">&mdash;</td>`;
    }
    trTotal.innerHTML = totalRowHtml;
    tbody.appendChild(trTotal);
    groupWeekSums[g.key] = { dayVals, weekSum };

    // Combined Ready Mix row: Line 1 + Line 2 together, checked against the
    // single combined Ready Mix target (management sets one number for both).
    if(g.key === 'readymix_l2'){
      const l1 = groupWeekSums['readymix_l1'] || { dayVals:{}, weekSum:0 };
      const l2 = groupWeekSums['readymix_l2'] || { dayVals:{}, weekSum:0 };
      const trCombine = document.createElement('tr');
      trCombine.className = 'daily-total-row combine-row';
      let combineHtml = `<td class="daily-total-head" colspan="2">Ready Mix Total<br>(Line 1 + Line 2)</td>`;
      let combineWeekSum = 0;
      days.forEach(day=>{
        const daySum = (l1.dayVals[day]||0) + (l2.dayVals[day]||0);
        combineWeekSum += daySum;
        if(daySum>0){
          combineHtml += `<td class="daily-total-cell"><div class="split-row"><span class="split-val">${fmt(daySum)}</span></div></td>`;
        } else {
          combineHtml += `<td class="daily-total-cell empty">&mdash;</td>`;
        }
      });
      combineHtml += `<td class="total-cell daily-total-cell"><div class="split-row"><span class="split-val">${fmt(combineWeekSum)}</span></div></td>`;
      const rmTarget = weekTargets['readymix'];
      if(rmTarget !== undefined && rmTarget !== null){
        const achievePct = Math.round((combineWeekSum/rmTarget)*1000)/10;
        combineHtml += `<td class="target-cell daily-total-cell" style="background:${bandBgSolid(achievePct)};">
          <div class="split-row">
            <span class="split-val" style="color:${bandText(achievePct)}; font-size:13px;">${fmt(rmTarget)}</span>
            <span class="split-div"></span>
            <span class="split-pct" style="color:${bandText(achievePct)}; font-size:13px;">${achievePct}%</span>
          </div>
        </td>`;
      } else {
        combineHtml += `<td class="target-cell daily-total-cell empty">&mdash;</td>`;
      }
      trCombine.innerHTML = combineHtml;
      tbody.appendChild(trCombine);
    }

    // Spacer row between production lines
    if(gi < DATA.groups.length - 1){
      const trSpacer = document.createElement('tr');
      trSpacer.className = 'group-spacer';
      trSpacer.innerHTML = `<td colspan="${4 + days.length}"></td>`;
      tbody.appendChild(trSpacer);
    }
  });

  table.appendChild(tbody);
}

loadData();
</script>
</body>
</html>
